services:
  postgres:
    image: postgres:16-alpine
    container_name: gitimpact-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gitimpact
      POSTGRES_PASSWORD: gitimpact
      POSTGRES_DB: gitimpact
    volumes:
      - gitimpact_pg:/var/lib/postgresql/data
      - ./packages/db/drizzle/0000_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./packages/db/drizzle/0001_github_app.sql:/docker-entrypoint-initdb.d/01_github_app.sql:ro
      - ./packages/db/drizzle/0002_intelligence.sql:/docker-entrypoint-initdb.d/02_intelligence.sql:ro
      - ./packages/db/drizzle/0003_checks.sql:/docker-entrypoint-initdb.d/03_checks.sql:ro
      - ./packages/db/drizzle/0004_v1_jobs.sql:/docker-entrypoint-initdb.d/04_v1_jobs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitimpact -d gitimpact"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gitimpact-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gitimpact_pg:
